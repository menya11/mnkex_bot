[project]
name = "mnkex-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "akm77", email = "aleksey.kotryakhov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
mnkex-bot = "mnkex_bot:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TC",  # flake8-type-checking
    "RUF", # ruff
]
# RUF003 treats Cyrillic а/е/о/р/с/у/х as Latin lookalikes. Russian comments
# use those letters as words («а», «с», «у»).
ignore = ["RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mnkex_bot"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = ["-m", "unit", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "unit: isolated tests with no external services",
    "integration: tests that use external services",
    "functional: end-to-end scenarios",
    "slow: tests excluded from the default run",
]
